<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ - ระบบตรวจเช็คกำจัดปลวก</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Noto Sans Thai', sans-serif;
      background: linear-gradient(135deg, #1B4332 0%, #2D6A4F 50%, #40916C 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-card {
      background: white;
      border-radius: 20px;
      padding: 40px 30px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.25);
      text-align: center;
    }
    .logo {
      font-size: 48px;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 22px;
      color: #1B4332;
      margin-bottom: 4px;
      font-weight: 700;
    }
    .subtitle {
      color: #6B7280;
      font-size: 14px;
      margin-bottom: 32px;
    }
    .pin-display {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    .pin-dot {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      border: 2px solid #E5E7EB;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 700;
      color: #1B4332;
      transition: all 0.2s;
    }
    .pin-dot.filled {
      border-color: #1B4332;
      background: #F0FDF4;
    }
    .pin-dot.error {
      border-color: #DC2626;
      background: #FEE2E2;
      animation: shake 0.4s;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }
    .numpad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      max-width: 280px;
      margin: 0 auto;
    }
    .numpad button {
      height: 64px;
      border-radius: 14px;
      border: 1px solid #E5E7EB;
      background: #F9FAFB;
      font-size: 24px;
      font-weight: 600;
      color: #1F2937;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .numpad button:active {
      background: #1B4332;
      color: white;
      transform: scale(0.95);
    }
    .numpad button.action {
      background: transparent;
      border-color: transparent;
      font-size: 16px;
      color: #6B7280;
    }
    .numpad button.action:active {
      background: #F3F4F6;
      color: #1F2937;
    }
    .numpad button.enter-btn {
      background: #1B4332;
      color: white;
      border-color: #1B4332;
    }
    .numpad button.enter-btn:active {
      background: #2D6A4F;
    }
    .error-msg {
      color: #DC2626;
      font-size: 14px;
      margin-top: 16px;
      min-height: 20px;
    }
    .loading-spinner {
      display: none;
      margin: 16px auto 0;
    }
    .loading-spinner.show {
      display: block;
    }
    .loading-spinner::after {
      content: '';
      display: block;
      width: 32px;
      height: 32px;
      margin: 0 auto;
      border: 3px solid #E5E7EB;
      border-top-color: #1B4332;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo">🏠</div>
    <h1>ระบบตรวจเช็คกำจัดปลวก</h1>
    <p class="subtitle">ใส่รหัส PIN เพื่อเข้าสู่ระบบ</p>

    <div class="pin-display" id="pinDisplay">
      <div class="pin-dot" id="dot0"></div>
      <div class="pin-dot" id="dot1"></div>
      <div class="pin-dot" id="dot2"></div>
      <div class="pin-dot" id="dot3"></div>
    </div>

    <div class="numpad">
      <button onclick="pressKey('1')">1</button>
      <button onclick="pressKey('2')">2</button>
      <button onclick="pressKey('3')">3</button>
      <button onclick="pressKey('4')">4</button>
      <button onclick="pressKey('5')">5</button>
      <button onclick="pressKey('6')">6</button>
      <button onclick="pressKey('7')">7</button>
      <button onclick="pressKey('8')">8</button>
      <button onclick="pressKey('9')">9</button>
      <button class="action" onclick="clearPin()">ล้าง</button>
      <button onclick="pressKey('0')">0</button>
      <button class="action" onclick="backspace()">⌫</button>
    </div>

    <p class="error-msg" id="errorMsg"></p>
    <div class="loading-spinner" id="loadingSpinner"></div>
  </div>

  <script>
    let pin = '';
    const maxLength = 4;

    function pressKey(num) {
      if (pin.length >= maxLength) return;
      pin += num;
      updateDisplay();

      if (pin.length === maxLength) {
        setTimeout(submitPin, 200);
      }
    }

    function clearPin() {
      pin = '';
      updateDisplay();
      document.getElementById('errorMsg').textContent = '';
    }

    function backspace() {
      pin = pin.slice(0, -1);
      updateDisplay();
      document.getElementById('errorMsg').textContent = '';
    }

    function updateDisplay() {
      for (let i = 0; i < maxLength; i++) {
        const dot = document.getElementById(`dot${i}`);
        dot.textContent = pin[i] ? '●' : '';
        dot.classList.toggle('filled', !!pin[i]);
        dot.classList.remove('error');
      }
    }

    async function submitPin() {
      const spinner = document.getElementById('loadingSpinner');
      const errorMsg = document.getElementById('errorMsg');
      spinner.classList.add('show');
      errorMsg.textContent = '';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin }),
        });

        const data = await res.json();

        if (data.success) {
          window.location.href = '/dashboard';
        } else {
          showError(data.error || 'PIN ไม่ถูกต้อง');
        }
      } catch {
        showError('ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้');
      } finally {
        spinner.classList.remove('show');
      }
    }

    function showError(msg) {
      document.getElementById('errorMsg').textContent = msg;
      for (let i = 0; i < maxLength; i++) {
        document.getElementById(`dot${i}`).classList.add('error');
      }
      setTimeout(clearPin, 1000);
    }

    // Keyboard support
    document.addEventListener('keydown', (e) => {
      if (e.key >= '0' && e.key <= '9') pressKey(e.key);
      else if (e.key === 'Backspace') backspace();
      else if (e.key === 'Escape') clearPin();
      else if (e.key === 'Enter' && pin.length === maxLength) submitPin();
    });
  </script>
</body>
</html>
