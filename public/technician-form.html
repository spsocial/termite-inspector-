<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ฟอร์มช่าง - ลูกค้าปลวก</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-layout">
    <div class="sidebar">
      <div class="sidebar-header"><h1>🏠 ลูกค้าปลวก</h1><span id="roleBadge" class="badge badge-success" style="margin-top:6px;">Admin</span></div>
      <nav class="sidebar-nav">
        <a href="/dashboard"><span class="icon">📊</span> แดชบอร์ด</a>
        <a href="/customers" data-admin-only><span class="icon">👥</span> รายชื่อลูกค้า</a>
        <a href="/customer-form" data-admin-only><span class="icon">➕</span> เพิ่มลูกค้า</a>
        <a href="/inspections"><span class="icon">📋</span> ตารางตรวจเช็ค</a>
        <a href="/technicians" data-admin-only><span class="icon">👷</span> จัดการช่าง</a>
        <a href="/history" data-admin-only><span class="icon">📜</span> ประวัติแก้ไข</a>
        <a href="/settings" data-admin-only><span class="icon">⚙️</span> ตั้งค่า</a>
      </nav>
      <div class="sidebar-footer"><a href="#" onclick="logout()"><span>🚪</span> ออกจากระบบ</a></div>
    </div>
    <div class="sidebar-overlay"></div>
    <button class="sidebar-toggle">☰</button>

    <div class="main-content">
      <div class="page-header">
        <h2 id="pageTitle">เพิ่มช่างใหม่</h2>
        <p id="pageDesc">กรอกข้อมูลช่างเพื่อสร้าง PIN เข้าระบบ</p>
      </div>

      <div class="card">
        <div class="card-body">
          <form id="techForm" onsubmit="submitForm(event)">
            <div class="form-row">
              <div class="form-group">
                <label>ชื่อช่าง *</label>
                <input type="text" class="form-control" id="name" required placeholder="ชื่อ-นามสกุล">
              </div>
              <div class="form-group">
                <label>เบอร์โทร</label>
                <input type="tel" class="form-control" id="phone" placeholder="0XX-XXX-XXXX">
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label>PIN เข้าระบบ * (4 หลักขึ้นไป)</label>
                <input type="text" class="form-control" id="pin" required minlength="4" maxlength="6" placeholder="เช่น 1111" pattern="[0-9]*" inputmode="numeric">
                <small style="color:var(--gray-500)">ช่างจะใช้ PIN นี้เข้าสู่ระบบแทนรหัส Admin</small>
              </div>
              <div class="form-group">
                <label>ยืนยัน PIN *</label>
                <input type="text" class="form-control" id="pinConfirm" required minlength="4" maxlength="6" placeholder="ใส่ PIN อีกครั้ง" pattern="[0-9]*" inputmode="numeric">
              </div>
            </div>

            <div style="display:flex;gap:12px;margin-top:24px;">
              <button type="submit" class="btn btn-primary" id="submitBtn">บันทึก</button>
              <a href="/technicians" class="btn btn-secondary">ยกเลิก</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    const editId = getParam('id');

    if (editId) {
      document.getElementById('pageTitle').textContent = 'แก้ไขข้อมูลช่าง';
      document.getElementById('pageDesc').textContent = `แก้ไขข้อมูลช่าง ${editId}`;
      loadTechnician();
    }

    async function loadTechnician() {
      try {
        const data = await API.get(`/api/technicians/${editId}`);
        document.getElementById('name').value = data.name;
        document.getElementById('phone').value = data.phone || '';
        // PIN ไม่แสดง — แต่ไม่บังคับกรอกตอนแก้ไข
        document.getElementById('pin').required = false;
        document.getElementById('pinConfirm').required = false;
        document.getElementById('pin').placeholder = 'เว้นว่างถ้าไม่ต้องการเปลี่ยน';
        document.getElementById('pinConfirm').placeholder = 'เว้นว่างถ้าไม่ต้องการเปลี่ยน';
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    async function submitForm(e) {
      e.preventDefault();

      const pin = document.getElementById('pin').value;
      const pinConfirm = document.getElementById('pinConfirm').value;

      if (pin && pin !== pinConfirm) {
        showToast('PIN ไม่ตรงกัน กรุณาตรวจสอบ', 'error');
        return;
      }

      const body = {
        name: document.getElementById('name').value,
        phone: document.getElementById('phone').value,
      };

      if (pin) {
        body.pin = pin;
      }

      if (!editId && !pin) {
        showToast('กรุณากรอก PIN', 'error');
        return;
      }

      try {
        showOverlay(editId ? 'กำลังแก้ไขข้อมูล...' : 'กำลังเพิ่มช่าง...');
        if (editId) {
          await API.put(`/api/technicians/${editId}`, body);
        } else {
          await API.post('/api/technicians', body);
        }
        document.getElementById('overlayMsg').textContent = 'สำเร็จ!';
        setTimeout(() => { window.location.href = '/technicians'; }, 1000);
      } catch (err) {
        hideOverlay();
        showToast(err.message, 'error');
      }
    }
  </script>
</body>
</html>
