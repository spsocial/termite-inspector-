<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ตารางตรวจเช็ค - ลูกค้าปลวก</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .customer-group {
      border: 1px solid var(--gray-200);
      border-radius: var(--radius);
      margin-bottom: 12px;
      overflow: hidden;
      transition: all 0.2s;
    }
    .customer-group:hover { box-shadow: var(--shadow); }
    .customer-group.has-overdue { border-left: 4px solid var(--danger); }
    .customer-group.all-completed { border-left: 4px solid var(--success); opacity: 0.75; }
    .customer-header {
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      user-select: none;
      background: var(--white);
      transition: background 0.15s;
    }
    .customer-header:hover { background: var(--gray-50, #f9fafb); }
    .customer-header .arrow {
      font-size: 12px;
      transition: transform 0.2s;
      color: var(--gray-400);
      flex-shrink: 0;
    }
    .customer-group.open .customer-header .arrow { transform: rotate(90deg); }
    .customer-header .info { flex: 1; }
    .customer-header .info h4 { font-size: 15px; font-weight: 600; margin: 0; }
    .customer-header .info .meta { font-size: 13px; color: var(--gray-500); margin-top: 2px; }
    .customer-header .badges { display: flex; gap: 6px; flex-wrap: wrap; }
    .customer-rounds {
      display: none;
      border-top: 1px solid var(--gray-200);
      background: var(--gray-50, #f9fafb);
    }
    .customer-group.open .customer-rounds { display: block; }
    .round-item {
      padding: 10px 16px 10px 44px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--gray-100, #f3f4f6);
      font-size: 14px;
    }
    .round-item:last-child { border-bottom: none; }
    .round-item.overdue { background: rgba(220,38,38,0.05); }
    .round-item .round-info { flex: 1; }
    .round-item .checkbox {
      width: 22px; height: 22px; border-radius: 50%;
      border: 2px solid var(--gray-300); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: all 0.2s; font-size: 12px;
    }
    .round-item .checkbox:hover { border-color: var(--success); }
    .round-item .checkbox.checked {
      background: var(--success); border-color: var(--success); color: white;
    }
    .batch-bar {
      position: fixed; bottom: 0; left: 260px; right: 0;
      background: var(--primary); color: white; padding: 16px 24px;
      display: flex; align-items: center; justify-content: space-between;
      z-index: 50; transform: translateY(100%); transition: transform 0.3s;
    }
    .batch-bar.show { transform: translateY(0); }
    @media (max-width: 768px) {
      .batch-bar { left: 0; }
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <div class="sidebar">
      <div class="sidebar-header"><h1>🏠 ลูกค้าปลวก</h1><span id="roleBadge" class="badge badge-success" style="margin-top:6px;">Admin</span></div>
      <nav class="sidebar-nav">
        <a href="/dashboard"><span class="icon">📊</span> แดชบอร์ด</a>
        <a href="/customers" data-admin-only><span class="icon">👥</span> รายชื่อลูกค้า</a>
        <a href="/customer-form" data-admin-only><span class="icon">➕</span> เพิ่มลูกค้า</a>
        <a href="/inspections"><span class="icon">📋</span> ตารางตรวจเช็ค</a>
        <a href="/technicians" data-admin-only><span class="icon">👷</span> จัดการช่าง</a>
        <a href="/history" data-admin-only><span class="icon">📜</span> ประวัติแก้ไข</a>
        <a href="/settings" data-admin-only><span class="icon">⚙️</span> ตั้งค่า</a>
      </nav>
      <div class="sidebar-footer"><a href="#" onclick="logout()"><span>🚪</span> ออกจากระบบ</a></div>
    </div>
    <div class="sidebar-overlay"></div>
    <button class="sidebar-toggle">☰</button>

    <div class="main-content">
      <div class="page-header" style="display:flex;justify-content:space-between;align-items:center;">
        <div>
          <h2 id="pageTitle">ตารางตรวจเช็ค</h2>
          <p>รายการงานตรวจเช็คทั้งหมด</p>
        </div>
        <div style="display:flex;gap:8px;" data-admin-only>
          <button class="btn btn-sm btn-outline" onclick="exportInspections()">📥 Export Excel</button>
        </div>
      </div>

      <!-- Filter -->
      <div class="filter-bar" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
        <div class="search-box" style="flex:1;min-width:200px;">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchInput" placeholder="ค้นหาชื่อลูกค้า..." oninput="debounceSearch()">
        </div>
        <div style="display:flex;gap:8px;align-items:center;">
          <button class="btn btn-sm btn-outline" onclick="changeFilterMonth(-1)">◀</button>
          <select class="form-control" id="filterMonth" onchange="renderList()" style="width:auto;padding:6px 12px;">
            <option value="">ทุกเดือน</option>
          </select>
          <button class="btn btn-sm btn-outline" onclick="changeFilterMonth(1)">▶</button>
        </div>
      </div>

      <!-- Tabs -->
      <div class="tabs">
        <button class="tab active" data-status="all" onclick="filterTab('all', this)">
          ทั้งหมด <span class="count" id="countAll">0</span>
        </button>
        <button class="tab" data-status="overdue" onclick="filterTab('overdue', this)">
          เกินกำหนด <span class="count" id="countOverdue">0</span>
        </button>
        <button class="tab" data-status="pending" onclick="filterTab('pending', this)">
          รอดำเนินการ <span class="count" id="countPending">0</span>
        </button>
        <button class="tab" data-status="my-claims" onclick="filterTab('my-claims', this)" id="tabMyClaims" style="display:none">
          งานของฉัน <span class="count" id="countMyClaims">0</span>
        </button>
        <button class="tab" data-status="completed" onclick="filterTab('completed', this)">
          เสร็จสิ้น <span class="count" id="countCompleted">0</span>
        </button>
      </div>

      <!-- List -->
      <div id="inspectionList">
        <div class="loading"><div class="spinner"></div>กำลังโหลด...</div>
      </div>
    </div>
  </div>

  <!-- Batch Action Bar -->
  <div class="batch-bar" id="batchBar">
    <span>เลือกแล้ว <strong id="selectedCount">0</strong> รายการ</span>
    <button class="btn btn-success" onclick="batchComplete()">✓ ทำเสร็จทั้งหมด</button>
  </div>

  <script src="/js/app.js"></script>
  <script>
    let allInspections = [];
    let currentTab = 'all';
    let selectedIds = new Set();
    let searchTimer;
    const customerId = getParam('customerId');

    if (customerId) {
      document.getElementById('pageTitle').textContent = `ตารางตรวจเช็ค - ${customerId}`;
    }

    // แสดงแท็บ "งานของฉัน" ถ้าเป็นช่าง
    if (isTechnician()) {
      document.getElementById('tabMyClaims').style.display = '';
    }

    // สร้าง options เดือน/ปี สำหรับ filter
    function buildMonthOptions() {
      const select = document.getElementById('filterMonth');
      const now = new Date();
      // สร้าง 12 เดือนย้อนหลัง + 12 เดือนข้างหน้า
      for (let offset = -12; offset <= 12; offset++) {
        const d = new Date(now.getFullYear(), now.getMonth() + offset, 1);
        const val = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
        const label = `${THAI_MONTHS[d.getMonth()]} ${d.getFullYear() + BE_OFFSET}`;
        const opt = document.createElement('option');
        opt.value = val;
        opt.textContent = label;
        // ไม่ select เดือนไหนเป็น default — ให้ "ทุกเดือน" เป็นค่าเริ่มต้น
        select.appendChild(opt);
      }
    }
    buildMonthOptions();

    function changeFilterMonth(delta) {
      const select = document.getElementById('filterMonth');
      const idx = select.selectedIndex;
      const newIdx = idx + delta;
      if (newIdx >= 0 && newIdx < select.options.length) {
        select.selectedIndex = newIdx;
        renderList();
      }
    }

    async function loadInspections() {
      try {
        let url = '/api/inspections';
        if (customerId) url += `?customerId=${customerId}`;
        allInspections = await API.get(url);
        updateCounts();
        renderList();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    function updateCounts() {
      const counts = { all: allInspections.length, pending: 0, overdue: 0, completed: 0, myClaims: 0 };
      allInspections.forEach(i => {
        if (i.status === 'overdue' || (i.status === 'pending' && i.daysUntilDue < 0)) {
          counts.overdue++;
        } else if (counts[i.status] !== undefined) {
          counts[i.status]++;
        }
        if (i.claimedBy === currentTechId && currentTechId) {
          counts.myClaims++;
        }
      });
      document.getElementById('countAll').textContent = counts.all;
      document.getElementById('countOverdue').textContent = counts.overdue;
      document.getElementById('countPending').textContent = counts.pending;
      document.getElementById('countCompleted').textContent = counts.completed;
      document.getElementById('countMyClaims').textContent = counts.myClaims;
    }

    function renderList() {
      const el = document.getElementById('inspectionList');
      let data = [...allInspections];

      // Filter by tab
      if (currentTab === 'overdue') {
        data = data.filter(i => i.status === 'overdue' || (i.status === 'pending' && i.daysUntilDue < 0));
      } else if (currentTab === 'my-claims') {
        data = data.filter(i => i.claimedBy === currentTechId && currentTechId);
      } else if (currentTab !== 'all') {
        data = data.filter(i => i.status === currentTab);
      }

      // Filter by month
      const filterMonth = document.getElementById('filterMonth').value;
      if (filterMonth) {
        data = data.filter(i => {
          if (!i.dueDate) return false;
          return i.dueDate.substring(0, 7) === filterMonth;
        });
      }

      // Search
      const search = document.getElementById('searchInput').value.toLowerCase();
      if (search) {
        data = data.filter(i =>
          i.customerName.toLowerCase().includes(search) ||
          i.id.toLowerCase().includes(search) ||
          i.customerId.toLowerCase().includes(search)
        );
      }

      if (data.length === 0) {
        el.innerHTML = '<div class="empty-state"><div class="icon">📋</div><h3>ไม่มีรายการตรวจเช็ค</h3></div>';
        return;
      }

      // จัดกลุ่มตามลูกค้า
      const groups = {};
      data.forEach(i => {
        if (!groups[i.customerId]) {
          groups[i.customerId] = {
            customerId: i.customerId,
            customerName: i.customerName,
            customerPhone: i.customerPhone,
            rounds: [],
          };
        }
        groups[i.customerId].rounds.push(i);
      });

      el.innerHTML = Object.values(groups).map(g => {
        const overdueCount = g.rounds.filter(i => i.status === 'overdue' || (i.status === 'pending' && i.daysUntilDue < 0)).length;
        const pendingCount = g.rounds.filter(i => i.status === 'pending' && i.daysUntilDue >= 0).length;
        const completedCount = g.rounds.filter(i => i.status === 'completed').length;
        const allDone = completedCount === g.rounds.length;

        let groupClass = 'customer-group';
        if (overdueCount > 0) groupClass += ' has-overdue';
        else if (allDone) groupClass += ' all-completed';

        // สรุป badges
        let badges = '';
        if (overdueCount > 0) badges += `<span class="badge badge-danger">เกินกำหนด ${overdueCount}</span>`;
        if (pendingCount > 0) badges += `<span class="badge badge-warning">รอ ${pendingCount}</span>`;
        if (completedCount > 0) badges += `<span class="badge badge-success">เสร็จ ${completedCount}</span>`;

        // แต่ละรอบ
        const roundsHTML = g.rounds.map(i => {
          const isOverdue = i.status === 'overdue' || (i.status === 'pending' && i.daysUntilDue < 0);
          const isCompleted = i.status === 'completed';
          const isSelected = selectedIds.has(i.id);

          return `
            <div class="round-item ${isOverdue ? 'overdue' : ''}">
              ${!isCompleted ? `
                <div class="checkbox ${isSelected ? 'checked' : ''}" onclick="event.stopPropagation();toggleSelect('${i.id}', this)">
                  ${isSelected ? '✓' : ''}
                </div>
              ` : '<div style="width:22px;text-align:center;color:var(--success)">✓</div>'}
              <div class="round-info">
                <span style="font-weight:600">รอบ ${i.round}</span>
                <span style="color:var(--gray-500);margin-left:8px">กำหนด ${toThaiDate(i.dueDate)}</span>
                ${i.actualDate ? `<span style="color:var(--gray-500);margin-left:8px">ตรวจจริง ${toThaiDate(i.actualDate)}</span>` : ''}
                ${i.technician ? `<span style="margin-left:8px">👷 ${i.technician}</span>` : ''}
              </div>
              <div style="display:flex;gap:4px;align-items:center;flex-shrink:0;">
                ${isOverdue ? `<span class="badge badge-danger" style="font-size:11px">เกิน ${Math.abs(i.daysUntilDue)} วัน</span>` : ''}
                ${!isOverdue && !isCompleted && i.daysUntilDue !== null && i.daysUntilDue <= 7 ? daysLabel(i.daysUntilDue) : ''}
                ${!isCompleted ? `<button class="btn btn-sm btn-success" style="font-size:12px;padding:2px 8px;" onclick="event.stopPropagation();quickComplete('${i.id}','${i.customerName.replace(/'/g,"\\'")}')">✓ เสร็จ</button>` : ''}
                <a href="/inspection-detail?id=${i.id}" class="btn btn-sm btn-outline" style="font-size:12px;padding:2px 8px;" onclick="event.stopPropagation()">ดู</a>
                ${isAdmin() ? `<button class="btn btn-sm" style="font-size:12px;padding:2px 8px;color:var(--danger);border:1px solid var(--danger);background:white;" onclick="event.stopPropagation();deleteInspection('${i.id}')">🗑</button>` : ''}
              </div>
            </div>
          `;
        }).join('');

        return `
          <div class="${groupClass}" id="group-${g.customerId}">
            <div class="customer-header" onclick="toggleGroup('${g.customerId}')">
              <span class="arrow">▶</span>
              <div class="info">
                <h4>${g.customerName}</h4>
                <div class="meta">${g.customerId} | ${g.rounds.length} รอบ${g.customerPhone ? ' | ' + g.customerPhone : ''}</div>
              </div>
              <div class="badges">${badges}</div>
            </div>
            <div class="customer-rounds">${roundsHTML}</div>
          </div>
        `;
      }).join('');
    }

    function toggleGroup(customerId) {
      const group = document.getElementById('group-' + customerId);
      group.classList.toggle('open');
    }

    function filterTab(status, el) {
      currentTab = status;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      renderList();
    }

    function debounceSearch() {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(renderList, 300);
    }

    function toggleSelect(id, el) {
      if (selectedIds.has(id)) {
        selectedIds.delete(id);
        el.classList.remove('checked');
        el.textContent = '';
      } else {
        selectedIds.add(id);
        el.classList.add('checked');
        el.textContent = '✓';
      }
      updateBatchBar();
    }

    function updateBatchBar() {
      const bar = document.getElementById('batchBar');
      document.getElementById('selectedCount').textContent = selectedIds.size;
      bar.classList.toggle('show', selectedIds.size > 0);
    }

    // ย่อรูปอัตโนมัติ
    function resizeImage(file, maxWidth = 400, quality = 0.4) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width, h = img.height;
            if (w > maxWidth) { h = (h * maxWidth) / w; w = maxWidth; }
            canvas.width = w;
            canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            canvas.toBlob(resolve, 'image/jpeg', quality);
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function deleteInspection(id) {
      if (!confirm('ยืนยันลบรอบตรวจเช็คนี้?')) return;
      try {
        showOverlay('กำลังลบ...');
        await API.del(`/api/inspections/${id}`);
        document.getElementById('overlayMsg').textContent = 'ลบเรียบร้อย!';
        setTimeout(() => window.location.reload(), 1000);
      } catch (err) {
        hideOverlay();
        showToast(err.message, 'error');
      }
    }

    // โหลดรายชื่อช่างสำหรับ dropdown
    let techList = [];
    async function loadTechList() {
      try { techList = await API.get('/api/technician-list'); } catch { techList = []; }
    }
    loadTechList();

    async function quickComplete(id, customerName) {
      const techOptions = techList.map(t =>
        `<option value="${t.name}">${t.name}${t.phone ? ' (' + t.phone + ')' : ''}</option>`
      ).join('');

      // วันที่ตรวจจริง — ให้เลือกได้ (default = วันนี้ ตามเวลาไทย)
      const now = new Date();
      const thai = new Date(now.getTime() + (7 * 60 * 60 * 1000));
      const todayStr = `${thai.getUTCFullYear()}-${String(thai.getUTCMonth()+1).padStart(2,'0')}-${String(thai.getUTCDate()).padStart(2,'0')}`;

      showModal('บันทึกผลตรวจเช็ค', `
        <p style="margin-bottom:16px"><strong>${customerName}</strong></p>
        <div class="form-group">
          <label>วันที่ตรวจจริง</label>
          <input type="date" class="form-control" id="qcDate" value="${todayStr}">
        </div>
        <div class="form-group">
          <label>ช่างผู้ตรวจ</label>
          <select class="form-control" id="qcTech">
            <option value="">-- เลือกช่าง --</option>
            ${techOptions}
            <option value="__other">อื่นๆ (พิมพ์เอง)</option>
          </select>
          <input type="text" class="form-control" id="qcTechOther" placeholder="พิมพ์ชื่อช่าง" style="display:none;margin-top:8px;">
        </div>
        <div class="form-group">
          <label>ผลการตรวจ</label>
          <textarea class="form-control" id="qcResult" placeholder="ผลการตรวจ"></textarea>
        </div>
        <div class="form-group">
          <label>📷 แนบรูปหลักฐาน</label>
          <input type="file" class="form-control" id="qcPhotos" accept="image/*" multiple>
          <small style="color:var(--gray-500)">เลือกได้หลายรูป ระบบย่อขนาดให้อัตโนมัติ</small>
        </div>
      `, `
        <button class="btn btn-secondary" onclick="closeModal()">ยกเลิก</button>
        <button class="btn btn-success" onclick="confirmComplete('${id}')">✓ บันทึก</button>
      `);

      // แสดงช่องพิมพ์เองถ้าเลือก "อื่นๆ"
      document.getElementById('qcTech').addEventListener('change', function() {
        document.getElementById('qcTechOther').style.display = this.value === '__other' ? '' : 'none';
      });
    }

    async function confirmComplete(id) {
      // อ่านค่า + copy files ก่อนปิด modal (สำคัญมาก!)
      const techSel = document.getElementById('qcTech')?.value || '';
      const techName = techSel === '__other'
        ? (document.getElementById('qcTechOther')?.value || '')
        : techSel;
      const resultText = document.getElementById('qcResult')?.value || '';
      const actualDate = document.getElementById('qcDate')?.value || '';
      const photoInput = document.getElementById('qcPhotos');
      const photoFileList = photoInput ? Array.from(photoInput.files) : [];

      closeModal();
      showOverlay('กำลังบันทึกผลตรวจเช็ค...');

      try {
        await API.put(`/api/inspections/${id}/complete`, {
          technician: techName,
          result: resultText,
          actualDate,
        });

        // อัพโหลดรูปหลักฐาน (ถ้ามี)
        if (photoFileList.length > 0) {
          document.getElementById('overlayMsg').textContent = 'กำลังอัพโหลดรูปหลักฐาน...';
          const formData = new FormData();
          for (const file of photoFileList) {
            const resized = await resizeImage(file);
            formData.append('photos', resized, file.name);
          }
          await API.upload(`/api/inspections/${id}/photos`, formData);
        }

        document.getElementById('overlayMsg').textContent = 'สำเร็จ! กำลังโหลดใหม่...';
        setTimeout(() => window.location.reload(), 1500);
      } catch (err) {
        hideOverlay();
        showToast(err.message || 'เกิดข้อผิดพลาด', 'error');
      }
    }

    async function batchComplete() {
      if (selectedIds.size === 0) return;

      const techField = isTechnician()
        ? `<div class="form-group" style="margin-top:16px">
            <label>ช่างผู้ตรวจ</label>
            <input type="text" class="form-control" id="batchTech" value="${currentDisplayName}" readonly style="background:var(--gray-100)">
          </div>`
        : `<div class="form-group" style="margin-top:16px">
            <label>ช่างผู้ตรวจ</label>
            <input type="text" class="form-control" id="batchTech" placeholder="ชื่อช่าง">
          </div>`;

      showModal('ยืนยันทำเสร็จหลายรายการ', `
        <p>จะบันทึกเสร็จสิ้น <strong>${selectedIds.size}</strong> รายการ</p>
        ${techField}
        <div class="form-group">
          <label>ผลการตรวจ</label>
          <textarea class="form-control" id="batchResult" placeholder="ผลการตรวจ"></textarea>
        </div>
      `, `
        <button class="btn btn-secondary" onclick="closeModal()">ยกเลิก</button>
        <button class="btn btn-success" onclick="confirmBatchComplete()">✓ ยืนยัน</button>
      `);
    }

    async function confirmBatchComplete() {
      try {
        closeModal();
        showOverlay(`กำลังบันทึก ${selectedIds.size} รายการ...`);
        const result = await API.post('/api/inspections/batch-complete', {
          ids: Array.from(selectedIds),
          technician: document.getElementById('batchTech')?.value || '',
          result: document.getElementById('batchResult')?.value || '',
        });
        selectedIds.clear();
        updateBatchBar();
        document.getElementById('overlayMsg').textContent = `บันทึกเสร็จ ${result.completedCount} รายการ!`;
        setTimeout(() => window.location.reload(), 1500);
      } catch (err) {
        hideOverlay();
        showToast(err.message, 'error');
      }
    }

    function exportInspections() {
      const status = currentTab !== 'all' ? `&status=${currentTab}` : '';
      const cid = customerId ? `&customerId=${customerId}` : '';
      downloadExport(`/api/export/inspections?format=excel${status}${cid}`, 'inspections.xlsx');
    }

    loadInspections();
  </script>
</body>
</html>
